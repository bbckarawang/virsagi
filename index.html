<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virsagi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* 1. Halaman Menu Utama / Dashboard Kosmik */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(26, 35, 58, 0.82) 0%, rgba(13, 17, 23, 0.95) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 500;
      padding: 16px 20px;
      overflow-y: auto;
    }

    /* Lapisan Background Foto Transparan */
    #main-menu::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('https://bbckarawang.github.io/virsagi/foto%20virsagi.png');
      background-size: cover;
      background-position: center 20%;
      background-repeat: no-repeat;
      opacity: 0.28;
      filter: contrast(1.05) saturate(1.1);
      z-index: -2;
      pointer-events: none;
    }

    /* Partikel Bintang Halus */
    .stars-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: 
        radial-gradient(1.5px 1.5px at 15% 20%, rgba(255, 255, 255, 0.6) 50%, transparent 100%),
        radial-gradient(1px 1px at 80% 15%, rgba(234, 179, 8, 0.7) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 75%, rgba(255, 255, 255, 0.5) 50%, transparent 100%),
        radial-gradient(2px 2px at 85% 65%, rgba(167, 139, 250, 0.6) 50%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, 0.8) 50%, transparent 100%);
      animation: twinkle 4s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Tombol Mengambang Kecil: KOSMIK */
    .kosmik-floating-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.85), rgba(15, 23, 42, 0.92));
      border: 1px solid rgba(234, 179, 8, 0.55);
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.35), 0 0 8px rgba(234, 179, 8, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 600;
      animation: floatOrb 3.2s infinite ease-in-out;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .kosmik-floating-btn:active {
      transform: scale(0.92);
      border-color: #eab308;
    }

    .kosmik-floating-btn svg {
      width: 15px;
      height: 15px;
      fill: #eab308;
      filter: drop-shadow(0 0 4px rgba(234, 179, 8, 0.8));
    }

    .kosmik-floating-btn span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fde047, #e9d5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    /* Header Logo & Identitas Virgo - Sagittarius */
    .logo-wrapper {
      position: relative;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.38), 0 0 12px rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(234, 179, 8, 0.65);
      background-color: #0d1117;
    }

    /* Badge Zodiak Kiri (Virgo Boy) & Kanan (Sagittarius Girl) */
    .zodiac-pill {
      position: absolute;
      bottom: 2px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(234, 179, 8, 0.5);
      color: #fde047;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.4px;
    }

    .zodiac-virgo {
      left: -46px;
      border-color: rgba(52, 211, 153, 0.5);
      color: #a7f3d0;
    }

    .zodiac-sagi {
      right: -46px;
      border-color: rgba(244, 114, 182, 0.5);
      color: #fbcfe8;
    }

    .app-title {
      font-size: 21px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 3px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .app-subtitle {
      font-size: 10px;
      color: #cbd5e1;
      margin-bottom: 18px;
      letter-spacing: 1.2px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    }

    /* Wrapper Menu Utama */
    .dashboard-wrapper {
      width: 100%;
      max-width: 345px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Grid Layout 2x2 dengan Center Floating Button */
    .menu-container {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    /* Kartu Menu Utama */
    .menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .menu-card:active {
      transform: scale(0.95);
      background: rgba(30, 41, 59, 0.88);
      border-color: rgba(234, 179, 8, 0.75);
    }

    .menu-card svg {
      width: 30px;
      height: 30px;
      fill: #eab308;
      margin-bottom: 7px;
      filter: drop-shadow(0 0 6px rgba(234, 179, 8, 0.5));
    }

    .menu-card span {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
    }

    /* Tombol Reminder Lingkaran di Tengah Grid */
    .reminder-center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.96) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 2px solid #eab308;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.55), inset 0 0 10px rgba(234, 179, 8, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.25s ease;
    }

    .reminder-center-btn:active {
      transform: translate(-50%, -50%) scale(0.9);
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.8);
    }

    .reminder-center-btn svg {
      width: 22px;
      height: 22px;
      fill: #eab308;
      filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.8));
    }

    .reminder-center-btn span {
      font-size: 8.5px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Baris Menu Tambahan (3 Kolom: Virtual Pet, Arcade, Meet) */
    .sub-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .sub-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 13px 6px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .sub-card:active {
      transform: scale(0.94);
      background: rgba(30, 41, 59, 0.88);
      border-color: rgba(234, 179, 8, 0.7);
    }

    .sub-card svg {
      width: 23px;
      height: 23px;
      fill: #eab308;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.45));
    }

    .sub-card span {
      font-size: 11px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.2;
    }

    /* 2. Area Iframe Full Screen */
    #app-container {
      display: none;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: #0d1117;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. Loading Screen Love Dark Mode */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .heart {
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      position: relative;
      transform: rotate(-45deg);
      animation: heartbeat 1.2s infinite ease-in-out;
      box-shadow: 0 0 20px rgba(255, 75, 92, 0.6);
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before { top: -20px; left: 0; }
    .heart::after { left: 20px; top: 0; }

    @keyframes heartbeat {
      0% { transform: rotate(-45deg) scale(0.8); }
      50% { transform: rotate(-45deg) scale(1.2); }
      100% { transform: rotate(-45deg) scale(0.8); }
    }

    .loading-text {
      margin-top: 35px;
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- 1. Tampilan Dashboard Kosmik -->
  <div id="main-menu">
    <div class="stars-layer"></div>

    <!-- Detil Kecil Mengambang: Menu Kosmik -->
    <div class="kosmik-floating-btn" onclick="openApp('https://bbckarawang.github.io/virsagi/fitur/kosmik', 'Memuat Kosmik...')">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2ZM19 3L19.8 5.2L22 6L19.8 6.8L19 9L18.2 6.8L16 6L18.2 5.2L19 3ZM5 15L5.8 17.2L8 18L5.8 18.8L5 21L4.2 18.8L2 18L4.2 17.2L5 15Z"/>
      </svg>
      <span>Kosmik</span>
    </div>

    <!-- Logo dengan Simbol Virgo Boy & Sagittarius Girl -->
    <div class="logo-wrapper">
      <span class="zodiac-pill zodiac-virgo">♍ Virgo</span>
      <img src="logo_virsagi.png" alt="Logo Virsagi" class="brand-logo" onerror="this.src='logo_virsagi.jpg';">
      <span class="zodiac-pill zodiac-sagi">Sagi ♐</span>
    </div>

    <div class="app-title">VIRSAGI</div>
    <div class="app-subtitle">♍ VIRGO BOY &bull; SAGITTARIUS GIRL ♐</div>

    <div class="dashboard-wrapper">
      <!-- Grid 2x2 Utama + Center Floating Reminder -->
      <div class="menu-container">
        
        <!-- Menu 1: Home -->
        <div class="menu-card" onclick="openApp('https://script.google.com/a/macros/pertiwi.ac.id/s/AKfycbyk6LGG36KtEAD8mnkDKf7qJaDt2m0I0UwL44eIegpXtBTj5rABdIYuE7rxaIE9k7bj/exec', 'Memuat Home...')">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </div>

        <!-- Menu 2: Care-lendar (Ikon Kalender + Tanaman) -->
        <div class="menu-card" onclick="openApp('https://bbckarawang.github.io/virsagi/care_lendar', 'Memuat Care-lendar...')">
          <svg viewBox="0 0 24 24">
            <!-- Kalender dengan sudut kanan bawah terbuka -->
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h7v-2H5V10h14v2h2V6c0-1.1-.9-2-2-2zm0 4H5V6h14v2z"/>
            <!-- Tunas Tanaman & Pot Kecil di Pojok Kanan Bawah -->
            <path d="M17.5 17.5v-2.2c-1.5 0-2.7-1.1-2.7-2.6 1.5 0 2.7 1.1 2.7 2.5.1-1.4 1.3-2.5 2.7-2.5 0 1.5-1.2 2.6-2.7 2.6v2.2H15l.7 4.5h3.6l.7-4.5h-2.5z"/>
          </svg>
          <span>Care-lendar</span>
        </div>

        <!-- Menu 3: Game -->
        <div class="menu-card" onclick="openApp('https://bbckarawang.github.io/virsagi/games', 'Memuat Game...')">
          <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          <span>Game</span>
        </div>

        <!-- Menu 4: Dictionary -->
        <div class="menu-card" onclick="openApp('https://script.google.com/macros/s/AKfycbxto3C5Rm1WmmIP2wIFd-txWjfnxXE4tUg2V8u5z0tVKrVItSDyxHZxzf8WsMgtkite/exec', 'Memuat Dictionary...')">
          <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4zm0 16v-2h12v2H6z"/></svg>
          <span>Dictionary</span>
        </div>

        <!-- Center Floating Button: Reminder -->
        <div class="reminder-center-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbwTntKSu0TWglbxxe5E5JVPShFxe3Z0l9VuWWtgO8glYrssyrLc0NtvK9Bumx3azO4/exec', 'Memuat Reminder...')">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span>Reminder</span>
        </div>

      </div>

      <!-- Baris Menu Baru: Virtual Pet, Arcade, Meet -->
      <div class="sub-menu-grid">
        
        <!-- Menu 5: Virtual Pet (Aquarium) -->
        <div class="sub-card" onclick="openApp('https://bbckarawang.github.io/virsagi/fitur/aquarium', 'Memuat Virtual Pet...')">
          <svg viewBox="0 0 24 24">
            <path d="M12 20c4.97 0 9-3.58 9-8 0-2.1-.91-4.01-2.4-5.44L20 5h-4l.91 1.07C15.51 5.39 13.81 5 12 5 7.03 5 3 8.58 3 13s4.03 7 9 7zm-2-8.5c1.66 0 3.14.69 4.22 1.78L16 11.5v4l-1.78-1.78A5.97 5.97 0 0 1 10 15.5c-2.21 0-4-1.34-4-3s1.79-3 4-3z"/>
          </svg>
          <span>Virtual Pet</span>
        </div>

        <!-- Menu 6: Arcade -->
        <div class="sub-card" onclick="openApp('https://bbckarawang.github.io/virsagi/fitur/arcade', 'Memuat Arcade...')">
          <svg viewBox="0 0 24 24">
            <path d="M7 2h10c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2zm1 3v6h8V5H8zm2.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm4 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2-1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
          </svg>
          <span>Arcade</span>
        </div>

        <!-- Menu 7: Meet (Connection) -->
        <div class="sub-card" onclick="openApp('https://bbckarawang.github.io/virsagi/fitur/connection', 'Memuat Meet...')">
          <svg viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span>Meet</span>
        </div>

      </div>
    </div>
  </div>

  <!-- 2. Area Full Screen Apps Script -->
  <div id="app-container">
    <div id="loader" class="hidden">
      <div class="heart"></div>
      <div class="loading-text" id="loader-text">Memuat...</div>
    </div>
    <iframe id="appFrame" src=""></iframe>
  </div>

  <script>
    const mainMenu = document.getElementById('main-menu');
    const appContainer = document.getElementById('app-container');
    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');

    iframe.onload = function() {
      loader.classList.add('hidden');
    };

    function openApp(url, titleText) {
      loaderText.innerText = titleText;
      loader.classList.remove('hidden');

      appContainer.style.display = 'block';
      mainMenu.style.display = 'none';

      iframe.src = url;
      history.pushState({ page: 'app' }, '', '');
    }

    function showMainMenu() {
      appContainer.style.display = 'none';
      mainMenu.style.display = 'flex';
      iframe.src = '';
    }

    window.onpopstate = function(event) {
      showMainMenu();
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW Registered'))
        .catch((err) => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
