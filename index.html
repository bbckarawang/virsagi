<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virsagi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Tema Kosmik Dark Theme */
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* 1. Halaman Menu Utama / Dashboard Kosmik */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a233a 0%, #0d1117 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 500;
      padding: 20px;
      overflow-y: auto;
    }

    /* Logo Virsagi Berdua */
    .brand-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.3), 0 0 10px rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(234, 179, 8, 0.5);
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .app-subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Grid Layout 2x2 dengan Center Floating Button */
    .menu-container {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 340px;
    }

    /* Kartu Menu Transparan & Glowing (Desain Kartu Grid) */
    .menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 10px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .menu-card:active {
      transform: scale(0.95);
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(234, 179, 8, 0.6);
    }

    .menu-card svg {
      width: 32px;
      height: 32px;
      fill: #eab308;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 6px rgba(234, 179, 8, 0.5));
    }

    .menu-card span {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
    }

    /* Tombol Reminder Lingkaran di Tengah Grid */
    .reminder-center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 2px solid #eab308;
      box-shadow: 0 0 18px rgba(234, 179, 8, 0.5), inset 0 0 10px rgba(234, 179, 8, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.25s ease;
    }

    .reminder-center-btn:active {
      transform: translate(-50%, -50%) scale(0.9);
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.8);
    }

    .reminder-center-btn svg {
      width: 24px;
      height: 24px;
      fill: #eab308;
      filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.8));
    }

    .reminder-center-btn span {
      font-size: 9px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* 2. Area Iframe Full Screen */
    #app-container {
      display: none;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: #0d1117;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. Loading Screen Love Dark Mode */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .heart {
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      position: relative;
      transform: rotate(-45deg);
      animation: heartbeat 1.2s infinite ease-in-out;
      box-shadow: 0 0 20px rgba(255, 75, 92, 0.6);
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before { top: -20px; left: 0; }
    .heart::after { left: 20px; top: 0; }

    @keyframes heartbeat {
      0% { transform: rotate(-45deg) scale(0.8); }
      50% { transform: rotate(-45deg) scale(1.2); }
      100% { transform: rotate(-45deg) scale(0.8); }
    }

    .loading-text {
      margin-top: 35px;
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- 1. Tampilan Dashboard Kosmik -->
  <div id="main-menu">
    <img src="logo_virsagi.png" alt="Logo Virsagi" class="brand-logo" onerror="this.src='logo_virsagi.jpg';">
    <div class="app-title">VIRSAGI</div>
    <div class="app-subtitle">DIFFERENT PATHS, SAME ADVENTURE</div>

    <!-- Grid 2x2 + Center Floating Reminder Button -->
    <div class="menu-container">
      
      <!-- Menu 1: Home -->
      <div class="menu-card" onclick="openApp('https://script.google.com/a/macros/pertiwi.ac.id/s/AKfycbyk6LGG36KtEAD8mnkDKf7qJaDt2m0I0UwL44eIegpXtBTj5rABdIYuE7rxaIE9k7bj/exec', 'Memuat Home...')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>

      <!-- Menu 2: Schedule -->
      <div class="menu-card" onclick="openApp('https://script.google.com/macros/s/AKfycbyh3EOXIMqa5S9xYDq8O4r3aNmc8Z2bCsK2DtiY_KMPU-ov5xYtYOp998Aoipmdm9M/exec', 'Memuat Schedule...')">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
        <span>Schedule</span>
      </div>

      <!-- Menu 3: Game -->
      <div class="menu-card" onclick="openApp('https://script.google.com/macros/s/AKfycbwRFoqleJLMSCcS4YaSX4jU2qnG-zGY7zQ5S1IXTgT-WmFgyxeIk_ZZEn9P0jEPyj4/exec', 'Memuat Game...')">
        <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>Game</span>
      </div>

      <!-- Menu 4: Dictionary -->
      <div class="menu-card" onclick="openApp('https://script.google.com/macros/s/AKfycbxto3C5Rm1WmmIP2wIFd-txWjfnxXE4tUg2V8u5z0tVKrVItSDyxHZxzf8WsMgtkite/exec', 'Memuat Dictionary...')">
        <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4zm0 16v-2h12v2H6z"/></svg>
        <span>Dictionary</span>
      </div>

      <!-- Center Floating Button: Reminder -->
      <div class="reminder-center-btn" onclick="openApp('https://script.google.com/macros/s/AKfycbwTntKSu0TWglbxxe5E5JVPShFxe3Z0l9VuWWtgO8glYrssyrLc0NtvK9Bumx3azO4/exec', 'Memuat Reminder...')">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span>Reminder</span>
      </div>

    </div>
  </div>

  <!-- 2. Area Full Screen Apps Script -->
  <div id="app-container">
    <div id="loader" class="hidden">
      <div class="heart"></div>
      <div class="loading-text" id="loader-text">Memuat...</div>
    </div>
    <iframe id="appFrame" src=""></iframe>
  </div>

  <script>
    const mainMenu = document.getElementById('main-menu');
    const appContainer = document.getElementById('app-container');
    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');

    iframe.onload = function() {
      loader.classList.add('hidden');
    };

    function openApp(url, titleText) {
      loaderText.innerText = titleText;
      loader.classList.remove('hidden');

      appContainer.style.display = 'block';
      mainMenu.style.display = 'none';

      iframe.src = url;
      history.pushState({ page: 'app' }, '', '');
    }

    function showMainMenu() {
      appContainer.style.display = 'none';
      mainMenu.style.display = 'flex';
      iframe.src = '';
    }

    window.onpopstate = function(event) {
      showMainMenu();
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW Registered'))
        .catch((err) => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
