<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virsagi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4285F4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f6fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 1. Halaman Menu Utama / Dashboard */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 500;
      padding: 20px;
    }

    .app-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 320px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-card:active {
      transform: scale(0.98);
      background-color: #f0f4fe;
    }

    .menu-card svg {
      width: 28px;
      height: 28px;
      fill: #4285F4;
      margin-right: 15px;
    }

    .menu-card span {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    /* 2. Area Iframe Full Screen */
    #app-container {
      display: none;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. Loading Screen Love */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .heart {
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      position: relative;
      transform: rotate(-45deg);
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before { top: -20px; left: 0; }
    .heart::after { left: 20px; top: 0; }

    @keyframes heartbeat {
      0% { transform: rotate(-45deg) scale(0.8); }
      50% { transform: rotate(-45deg) scale(1.2); }
      100% { transform: rotate(-45deg) scale(0.8); }
    }

    .loading-text {
      margin-top: 35px;
      font-size: 13px;
      color: #777777;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- 1. Tampilan Menu Utama saat Pertama Kali Dibuka -->
  <div id="main-menu">
    <div class="app-title">Pilih Menu Virsagi</div>
    <div class="menu-container">
      
      <!-- Menu Home (Rumah) -->
      <div class="menu-card" onclick="openApp('https://script.google.com/a/macros/pertiwi.ac.id/s/AKfycbyk6LGG36KtEAD8mnkDKf7qJaDt2m0I0UwL44eIegpXtBTj5rABdIYuE7rxaIE9k7bj/exec', 'Memuat Home...')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>

      <!-- Menu Schedule (Kalender) -->
      <div class="menu-card" onclick="openApp('https://script.google.com/macros/s/AKfycbyh3EOXIMqa5S9xYDq8O4r3aNmc8Z2bCsK2DtiY_KMPU-ov5xYtYOp998Aoipmdm9M/exec', 'Memuat Schedule...')">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
        <span>Schedule</span>
      </div>

      <!-- Menu Game (Game Console) -->
      <div class="menu-card" onclick="openApp('https://script.google.com/macros/s/AKfycbwRFoqleJLMSCcS4YaSX4jU2qnG-zGY7zQ5S1IXTgT-WmFgyxeIk_ZZEn9P0jEPyj4/exec', 'Memuat Game...')">
        <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>Game</span>
      </div>

    </div>
  </div>

  <!-- 2. Area Tampilan Aplikasi Full Screen -->
  <div id="app-container">
    <div id="loader" class="hidden">
      <div class="heart"></div>
      <div class="loading-text" id="loader-text">Memuat...</div>
    </div>
    <iframe id="appFrame" src=""></iframe>
  </div>

  <script>
    const mainMenu = document.getElementById('main-menu');
    const appContainer = document.getElementById('app-container');
    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');

    // Hilangkan loading saat iframe selesai dimuat
    iframe.onload = function() {
      loader.classList.add('hidden');
    };

    // Fungsi Membuka Aplikasi (Full Screen)
    function openApp(url, titleText) {
      // Tampilkan Loading
      loaderText.innerText = titleText;
      loader.classList.remove('hidden');

      // Tampilkan kontainer full screen & sembunyikan menu
      appContainer.style.display = 'block';
      mainMenu.style.display = 'none';

      // Set URL ke iframe
      iframe.src = url;

      // Tambahkan status ke histori browser agar tombol Back HP berfungsi
      history.pushState({ page: 'app' }, '', '');
    }

    // Fungsi Kembali ke Menu Utama
    function showMainMenu() {
      appContainer.style.display = 'none';
      mainMenu.style.display = 'flex';
      iframe.src = ''; // Bersihkan iframe
    }

    // Mendeteksi Tombol Back di HP Android
    window.onpopstate = function(event) {
      // Jika tombol back ditekan, kembalikan ke menu utama
      showMainMenu();
    };

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW Registered'))
        .catch((err) => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
