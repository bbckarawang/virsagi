<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virsagi</title>
  
  <!-- Koneksi ke Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4285F4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* Iframe Apps Script */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Screen Container */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Animasi Heartbeat Love */
    .heart {
      width: 50px;
      height: 50px;
      background-color: #ff4b5c;
      position: relative;
      transform: rotate(-45deg);
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 50px;
      height: 50px;
      background-color: #ff4b5c;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -25px;
      left: 0;
    }

    .heart::after {
      left: 25px;
      top: 0;
    }

    @keyframes heartbeat {
      0% { transform: rotate(-45deg) scale(0.8); }
      50% { transform: rotate(-45deg) scale(1.2); }
      100% { transform: rotate(-45deg) scale(0.8); }
    }

    /* Teks Loading opsional di bawah Love */
    .loading-text {
      margin-top: 40px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #777777;
      letter-spacing: 1px;
    }

    /* Class untuk menyembunyikan loading */
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- Element Loading Screen Love -->
  <div id="loader">
    <div class="heart"></div>
    <div class="loading-text">Memuat Virsagi...</div>
  </div>

  <!-- URL Apps Script kamu -->
  <iframe id="appFrame" src="https://script.google.com/a/macros/pertiwi.ac.id/s/AKfycbyk6LGG36KtEAD8mnkDKf7qJaDt2m0I0UwL44eIegpXtBTj5rABdIYuE7rxaIE9k7bj/exec"></iframe>

  <script>
    // Hilangkan Loading Screen ketika iframe selesai memuat data
    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loader');

    iframe.onload = function() {
      loader.classList.add('hidden');
    };

    // Mendaftarkan Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW Registered'))
        .catch((err) => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
