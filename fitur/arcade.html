<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VirSagi Arcade Corner</title>
  <style>
    :root {
      --bg-deep: #070b17;
      --bg-panel: #10182e;
      --bg-card: #16213e;
      --bg-card-hover: #1e2d54;
      --gold: #f5b942;
      --gold-soft: rgba(245, 185, 66, 0.16);
      --gold-border: rgba(245, 185, 66, 0.36);
      --text-main: #f3f6ff;
      --text-muted: #9aa7c7;
      --accent-cyan: #4cc9f0;
      --accent-rose: #ff5d8f;
      --accent-mint: #4ade80;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 10%, rgba(76, 201, 240, 0.12), transparent 42%),
        radial-gradient(circle at 85% 15%, rgba(245, 185, 66, 0.14), transparent 45%),
        var(--bg-deep);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-shell {
      max-width: 780px;
      margin: 0 auto;
      padding: 14px 14px 40px;
    }

    .top-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(16, 24, 46, 0.9);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      margin-bottom: 14px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      color: var(--gold);
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn {
      appearance: none;
      border: 1px solid var(--gold-border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 11px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.active-pill {
      background: var(--gold);
      color: #141006;
      border-color: var(--gold);
    }

    .btn-gold {
      background: var(--gold);
      color: #141006;
      border-color: var(--gold);
    }

    .btn-gold:hover {
      background: #ffca5c;
    }

    /* Hub Menu 10 Game */
    .arcade-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    @media (min-width: 600px) {
      .arcade-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .game-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      padding: 13px;
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold-border);
      background: var(--bg-card);
    }

    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .game-icon {
      font-size: 1.45rem;
      line-height: 1;
    }

    .game-num {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .game-name {
      margin: 0 0 4px;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .game-desc {
      margin: 0 0 10px;
      font-size: 0.77rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .game-meta {
      font-size: 0.74rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Layar Game Aktif */
    .stage-wrap {
      display: none;
      background: var(--bg-panel);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .stage-wrap.active {
      display: block;
    }

    .stage-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stage-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-title {
      margin: 0;
      font-size: 1.02rem;
      color: var(--gold);
    }

    .stage-stats {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-msg {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(245, 185, 66, 0.15);
      border: 1px solid var(--gold-border);
      color: var(--text-main);
      font-size: 0.84rem;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .banner-msg.show {
      display: flex;
    }

    .game-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 290px;
      width: 100%;
    }

    .hint-text {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    canvas.game-canvas {
      max-width: 100%;
      border-radius: 12px;
      background: #090e1c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      touch-action: none;
      display: block;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    /* Tetris Full-Width Controls */
    .tetris-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .tetris-btn {
      height: 54px;
      border-radius: 12px;
      border: 1px solid var(--gold-border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tetris-btn:active {
      background: var(--gold);
      color: #111;
    }

    /* Snake D-Pad */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 62px);
      gap: 8px;
      justify-content: center;
    }

    .pad-btn {
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .pad-btn:active {
      background: var(--gold);
      color: #111;
    }

    .row-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }

    /* Sliding Puzzle Multi-Level */
    .slide-board {
      display: grid;
      gap: 6px;
      padding: 10px;
      width: min(100%, 340px);
      aspect-ratio: 1 / 1;
      background: #0a1020;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slide-tile {
      border-radius: 10px;
      border: 1px solid var(--gold-border);
      background: var(--bg-card);
      color: var(--gold);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .slide-tile.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    /* Solitaire PC-Style Table */
    .sol-table {
      width: 100%;
      background: radial-gradient(circle at 50% 20%, #144d38, #0c2e22 85%);
      border: 1px solid rgba(245, 185, 66, 0.32);
      border-radius: 14px;
      padding: 10px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }

    .sol-top-row {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      align-items: center;
    }

    .sol-slot {
      aspect-ratio: 2.4 / 3.3;
      border-radius: 7px;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.22);
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .sol-card-face {
      aspect-ratio: 2.4 / 3.3;
      width: 100%;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-weight: 800;
      cursor: pointer;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      position: relative;
      text-align: left;
    }

    .sol-card-face.red {
      color: #dc2626;
    }

    .sol-card-face.back {
      background: linear-gradient(135deg, #1e3a8a, #312e81);
      border-color: rgba(245, 185, 66, 0.5);
      color: var(--gold);
      align-items: center;
      justify-content: center;
    }

    .sol-card-face.selected {
      outline: 3px solid var(--gold);
      transform: translateY(-2px);
      z-index: 20 !important;
    }

    .sol-corner {
      font-size: 0.74rem;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .sol-center-suit {
      font-size: 1.05rem;
      align-self: center;
      opacity: 0.85;
    }

    .sol-tableau-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      align-items: start;
      min-height: 250px;
    }

    .sol-stack-col {
      position: relative;
      min-height: 95px;
    }

    .sol-stack-item {
      position: absolute;
      left: 0;
      right: 0;
    }

    /* Minesweeper */
    .mine-grid {
      display: grid;
      grid-template-columns: repeat(8, 36px);
      gap: 4px;
      padding: 8px;
      background: #0a1020;
      border-radius: 12px;
    }

    .mine-cell {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
    }

    .mine-cell.revealed {
      background: #101930;
      border-color: rgba(255, 255, 255, 0.06);
      cursor: default;
    }

    .mine-cell.flagged {
      color: var(--gold);
    }

    /* Pattern Memory */
    .simon-grid {
      display: grid;
      grid-template-columns: repeat(2, 115px);
      gap: 12px;
    }

    .simon-pad {
      height: 115px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.16);
      opacity: 0.65;
      font-weight: 800;
      font-size: 0.95rem;
      color: #090d16;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.12s ease, box-shadow 0.12s ease;
    }

    .simon-pad.lit {
      opacity: 1;
      transform: scale(1.04);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-brand">
      <div>
        <h1 class="brand-title">VIRSAGI ARCADE</h1>
        <p class="brand-sub">10 Game Solo • Different Paths, Same Adventure</p>
      </div>
      <button id="globalSoundBtn" class="btn" type="button">SFX: ON</button>
    </header>

    <!-- HUB MENU 10 GAME -->
    <main id="arcadeHub" class="arcade-grid"></main>

    <!-- STAGE GAME AKTIF -->
    <section id="gameStage" class="stage-wrap" aria-live="polite">
      <div class="stage-header">
        <div class="stage-title-group">
          <button id="backToHubBtn" class="btn" type="button">← Arcade</button>
          <div>
            <h2 id="stageTitle" class="stage-title">Game</h2>
            <div id="stageStats" class="stage-stats">Skor: 0</div>
          </div>
        </div>
        <div class="stage-actions">
          <button id="restartGameBtn" class="btn btn-gold" type="button">Ulangi</button>
        </div>
      </div>

      <div id="stageBanner" class="banner-msg">
        <span id="stageBannerText"></span>
        <button id="stageBannerBtn" class="btn btn-gold" type="button">Main Lagi</button>
      </div>

      <div id="gameBody" class="game-body"></div>
    </section>
  </div>

  <script>
    /**
     * 1. SHARED CORE (Namespace Tunggal + Isolasi Storage + Web Audio SFX)
     */
    const VirSagiArcade = (() => {
      const STORAGE_PREFIX = "virsagi_arcade_v2_";
      let soundEnabled = true;
      let audioCtx = null;
      let activeGameId = null;

      const dom = {
        hub: document.getElementById("arcadeHub"),
        stage: document.getElementById("gameStage"),
        stageTitle: document.getElementById("stageTitle"),
        stageStats: document.getElementById("stageStats"),
        stageBanner: document.getElementById("stageBanner"),
        stageBannerText: document.getElementById("stageBannerText"),
        stageBannerBtn: document.getElementById("stageBannerBtn"),
        gameBody: document.getElementById("gameBody"),
        backBtn: document.getElementById("backToHubBtn"),
        restartBtn: document.getElementById("restartGameBtn"),
        soundBtn: document.getElementById("globalSoundBtn")
      };

      const Games = {};

      function makeKey(gameId, subKey) {
        return `${STORAGE_PREFIX}${gameId}_${subKey}`;
      }

      function readStorage(gameId, subKey, fallback = null) {
        try {
          const raw = localStorage.getItem(makeKey(gameId, subKey));
          return raw === null ? fallback : JSON.parse(raw);
        } catch (_) {
          return fallback;
        }
      }

      function writeStorage(gameId, subKey, value) {
        try {
          localStorage.setItem(makeKey(gameId, subKey), JSON.stringify(value));
        } catch (_) {}
      }

      function playTone(freq = 520, duration = 0.08, type = "sine") {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (!audioCtx) return;
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.075, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (_) {}
      }

      function setStats(text) {
        dom.stageStats.textContent = text;
      }

      function hideBanner() {
        dom.stageBanner.classList.remove("show");
      }

      function showBanner(message, btnLabel = "Main Lagi", onAction = null) {
        dom.stageBannerText.textContent = message;
        dom.stageBannerBtn.textContent = btnLabel;
        dom.stageBannerBtn.onclick = () => {
          hideBanner();
          if (typeof onAction === "function") {
            onAction();
          } else if (activeGameId && Games[activeGameId]) {
            Games[activeGameId].restart();
          }
        };
        dom.stageBanner.classList.add("show");
      }

      function updateBestIfHigher(gameId, score) {
        const prev = readStorage(gameId, "best", 0);
        if (score > prev) {
          writeStorage(gameId, "best", score);
          return score;
        }
        return prev;
      }

      function unmountActiveGame() {
        if (activeGameId && Games[activeGameId] && typeof Games[activeGameId].unmount === "function") {
          Games[activeGameId].unmount();
        }
        activeGameId = null;
        hideBanner();
        dom.gameBody.innerHTML = "";
      }

      function openGame(gameId) {
        const mod = Games[gameId];
        if (!mod) return;
        unmountActiveGame();
        activeGameId = gameId;
        dom.hub.style.display = "none";
        dom.stage.classList.add("active");
        dom.stageTitle.textContent = `${mod.icon} ${mod.title}`;
        setStats("Memuat...");
        mod.mount(dom.gameBody);
      }

      function backToHub() {
        unmountActiveGame();
        dom.stage.classList.remove("active");
        dom.hub.style.display = "grid";
        renderHub();
      }

      function renderHub() {
        const order = [
          "sliding",
          "tetris",
          "snake",
          "flappy",
          "solitaire",
          "minesweeper",
          "tangram",
          "pattern",
          "merge",
          "bubble"
        ];
        dom.hub.innerHTML = "";
        order.forEach((id, idx) => {
          const g = Games[id];
          if (!g) return;
          const best = readStorage(id, "best", 0);
          const card = document.createElement("button");
          card.type = "button";
          card.className = "game-card";
          card.innerHTML = `
            <div>
              <div class="game-card-top">
                <span class="game-icon">${g.icon}</span>
                <span class="game-num">#${String(idx + 1).padStart(2, "0")}</span>
              </div>
              <h3 class="game-name">${g.title}</h3>
              <p class="game-desc">${g.desc}</p>
            </div>
            <div class="game-meta">Rekor: ${best}</div>
          `;
          card.addEventListener("click", () => {
            playTone(620, 0.06, "triangle");
            openGame(id);
          });
          dom.hub.appendChild(card);
        });
      }

      dom.backBtn.addEventListener("click", () => {
        playTone(420, 0.06, "sine");
        backToHub();
      });

      dom.restartBtn.addEventListener("click", () => {
        if (!activeGameId || !Games[activeGameId]) return;
        playTone(540, 0.07, "triangle");
        hideBanner();
        Games[activeGameId].restart();
      });

      dom.soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        dom.soundBtn.textContent = soundEnabled ? "SFX: ON" : "SFX: OFF";
        if (soundEnabled) playTone(680, 0.08, "sine");
      });

      function init() {
        renderHub();
      }

      return {
        Games,
        init,
        setStats,
        showBanner,
        hideBanner,
        playTone,
        readStorage,
        writeStorage,
        updateBestIfHigher
      };
    })();

    /**
     * 2. MODUL 10 GAME SOLO
     */

    // #01 SLIDING PUZZLE (Easy 3x3, Medium 4x4, Hard 5x5)
    VirSagiArcade.Games.sliding = (() => {
      const ID = "sliding";
      const LEVELS = [
        { key: "easy", label: "Easy (3×3)", size: 3, basePts: 1000 },
        { key: "medium", label: "Medium (4×4)", size: 4, basePts: 2500 },
        { key: "hard", label: "Hard (5×5)", size: 5, basePts: 5000 }
      ];
      let levelIdx = 0;
      let tiles = [];
      let moves = 0;
      let boardEl = null;
      let levelBtns = [];

      function getSize() {
        return LEVELS[levelIdx].size;
      }

      function isSolved(arr) {
        const total = arr.length;
        for (let i = 0; i < total - 1; i++) {
          if (arr[i] !== i + 1) return false;
        }
        return arr[total - 1] === 0;
      }

      // Acak melalui langkah valid dari kondisi terpecahkan agar 100% solvable di semua ukuran
      function shuffleBoard() {
        const size = getSize();
        const total = size * size;
        tiles = Array.from({ length: total }, (_, i) => (i === total - 1 ? 0 : i + 1));
        let emptyIdx = total - 1;
        let prevIdx = -1;
        const scrambleSteps = size === 3 ? 65 : size === 4 ? 150 : 280;

        for (let s = 0; s < scrambleSteps; s++) {
          const r = Math.floor(emptyIdx / size);
          const c = emptyIdx % size;
          const neighbors = [];
          if (r > 0) neighbors.push(emptyIdx - size);
          if (r < size - 1) neighbors.push(emptyIdx + size);
          if (c > 0) neighbors.push(emptyIdx - 1);
          if (c < size - 1) neighbors.push(emptyIdx + 1);
          const filtered = neighbors.filter((n) => n !== prevIdx);
          const pick = filtered[Math.floor(Math.random() * filtered.length)];
          [tiles[emptyIdx], tiles[pick]] = [tiles[pick], tiles[emptyIdx]];
          prevIdx = emptyIdx;
          emptyIdx = pick;
        }

        if (isSolved(tiles)) {
          [tiles[total - 2], tiles[total - 1]] = [tiles[total - 1], tiles[total - 2]];
        }
        moves = 0;
        VirSagiArcade.hideBanner();
        render();
      }

      function tryMove(idx) {
        const size = getSize();
        const emptyIdx = tiles.indexOf(0);
        const r1 = Math.floor(idx / size);
        const c1 = idx % size;
        const r2 = Math.floor(emptyIdx / size);
        const c2 = emptyIdx % size;
        if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;

        [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
        moves++;
        VirSagiArcade.playTone(580, 0.045, "sine");
        render();

        if (isSolved(tiles)) {
          const lv = LEVELS[levelIdx];
          const score = Math.max(150, lv.basePts - moves * 8);
          const best = VirSagiArcade.updateBestIfHigher(ID, score);
          VirSagiArcade.playTone(860, 0.16, "triangle");
          const hasNext = levelIdx < LEVELS.length - 1;
          VirSagiArcade.showBanner(
            `${lv.label} selesai dalam ${moves} langkah! Skor: ${score} (Rekor: ${best})`,
            hasNext ? "Lanjut Level Berikutnya" : "Acak Baru",
            () => {
              if (hasNext) levelIdx++;
              shuffleBoard();
            }
          );
        }
      }

    // #02 TETRIS (Full-Width Mobile Controls)
    VirSagiArcade.Games.tetris = (() => {
      const ID = "tetris";
      const COLS = 10;
      const ROWS = 18;
      const CELL = 21;
      const SHAPES = [
        { color: "#4cc9f0", mat: [[1, 1, 1, 1]] },
        { color: "#f5b942", mat: [[1, 1], [1, 1]] },
        { color: "#c77dff", mat: [[0, 1, 0], [1, 1, 1]] },
        { color: "#4ade80", mat: [[0, 1, 1], [1, 1, 0]] },
        { color: "#ff5d8f", mat: [[1, 1, 0], [0, 1, 1]] },
        { color: "#60a5fa", mat: [[1, 0, 0], [1, 1, 1]] },
        { color: "#fb923c", mat: [[0, 0, 1], [1, 1, 1]] }
      ];

      let canvas = null;
      let ctx = null;
      let board = [];
      let current = null;
      let score = 0;
      let lines = 0;
      let dropTimer = null;
      let isOver = false;

      function createEmptyBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      }

      function randomPiece() {
        const pick = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const mat = pick.mat.map((row) => [...row]);
        return {
          color: pick.color,
          mat,
          x: Math.floor((COLS - mat[0].length) / 2),
          y: 0
        };
      }

      function rotateMat(mat) {
        const rows = mat.length;
        const cols = mat[0].length;
        return Array.from({ length: cols }, (_, c) =>
          Array.from({ length: rows }, (__, r) => mat[rows - 1 - r][c])
        );
      }

      function collides(mat, px, py) {
        for (let r = 0; r < mat.length; r++) {
          for (let c = 0; c < mat[r].length; c++) {
            if (!mat[r][c]) continue;
            const nx = px + c;
            const ny = py + r;
            if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
            if (ny >= 0 && board[ny][nx]) return true;
          }
        }
        return false;
      }

      function mergePiece() {
        current.mat.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val && current.y + r >= 0) {
              board[current.y + r][current.x + c] = current.color;
            }
          });
        });

        let cleared = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (board[r].every((cell) => cell !== null)) {
            board.splice(r, 1);
            board.unshift(Array(COLS).fill(null));
            cleared++;
            r++;
          }
        }

        if (cleared > 0) {
          lines += cleared;
          score += cleared * 100 * cleared;
          VirSagiArcade.playTone(720, 0.09, "triangle");
          scheduleDrop();
        }

        current = randomPiece();
        if (collides(current.mat, current.x, current.y)) {
          isOver = true;
          clearInterval(dropTimer);
          const best = VirSagiArcade.updateBestIfHigher(ID, score);
          VirSagiArcade.playTone(220, 0.22, "sawtooth");
          VirSagiArcade.showBanner(`Game Over! Skor: ${score} • Rekor: ${best}`);
        }
        updateStats();
      }

      function stepDown() {
        if (isOver || !current) return;
        if (!collides(current.mat, current.x, current.y + 1)) {
          current.y++;
        } else {
          mergePiece();
        }
        draw();
      }

      function moveHoriz(dx) {
        if (isOver || !current) return;
        if (!collides(current.mat, current.x + dx, current.y)) {
          current.x += dx;
          draw();
        }
      }

      function rotateCurrent() {
        if (isOver || !current) return;
        const rot = rotateMat(current.mat);
        if (!collides(rot, current.x, current.y)) {
          current.mat = rot;
          VirSagiArcade.playTone(610, 0.04, "sine");
          draw();
        }
      }

      function scheduleDrop() {
        clearInterval(dropTimer);
        const speedMs = Math.max(170, 620 - lines * 22);
        dropTimer = setInterval(stepDown, speedMs);
      }

      function updateStats() {
        const best = VirSagiArcade.readStorage(ID, "best", 0);
        VirSagiArcade.setStats(`Skor: ${score} • Baris: ${lines} • Rekor: ${best}`);
      }

      function draw() {
        if (!ctx) return;
        ctx.fillStyle = "#090e1c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            ctx.strokeStyle = "rgba(255,255,255,0.04)";
            ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
            if (board[r][c]) {
              ctx.fillStyle = board[r][c];
              ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
            }
          }
        }

        if (current) {
          ctx.fillStyle = current.color;
          current.mat.forEach((row, r) => {
            row.forEach((val, c) => {
              if (val) {
                ctx.fillRect(
                  (current.x + c) * CELL + 1,
                  (current.y + r) * CELL + 1,
                  CELL - 2,
                  CELL - 2
                );
              }
            });
          });
        }
      }

      function onKeyDown(e) {
        if (isOver) return;
        if (e.key === "ArrowLeft") moveHoriz(-1);
        else if (e.key === "ArrowRight") moveHoriz(1);
        else if (e.key === "ArrowDown") stepDown();
        else if (e.key === "ArrowUp" || e.key === " ") {
          e.preventDefault();
          rotateCurrent();
        }
      }

      function restart() {
        clearInterval(dropTimer);
        board = createEmptyBoard();
        score = 0;
        lines = 0;
        isOver = false;
        current = randomPiece();
        updateStats();
        draw();
        scheduleDrop();
      }

      function mount(container) {
        canvas = document.createElement("canvas");
        canvas.className = "game-canvas";
        canvas.width = COLS * CELL;
        canvas.height = ROWS * CELL;
        ctx = canvas.getContext("2d");

        const controls = document.createElement("div");
        controls.className = "tetris-controls";
        controls.innerHTML = `
          <button type="button" class="tetris-btn" data-act="left" aria-label="Kiri">◀</button>
          <button type="button" class="tetris-btn" data-act="rot" aria-label="Putar">↻</button>
          <button type="button" class="tetris-btn" data-act="down" aria-label="Turun">▼</button>
          <button type="button" class="tetris-btn" data-act="right" aria-label="Kanan">▶</button>
        `;
        controls.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-act]");
          if (!btn) return;
          const act = btn.dataset.act;
          if (act === "left") moveHoriz(-1);
          else if (act === "right") moveHoriz(1);
          else if (act === "down") stepDown();
          else if (act === "rot") rotateCurrent();
        });

        const hint = document.createElement("p");
        hint.className = "hint-text";
        hint.textContent = "Gunakan tombol lebar di bawah layar HP untuk geser, putar, dan percepat balok.";

        container.appendChild(canvas);
        container.appendChild(controls);
        container.appendChild(hint);
        window.addEventListener("keydown", onKeyDown);
        restart();
      }

      function unmount() {
        clearInterval(dropTimer);
        dropTimer = null;
        window.removeEventListener("keydown", onKeyDown);
        canvas = null;
        ctx = null;
      }

      return {
        icon: "🧱",
        title: "Tetris",
        desc: "Susun balok jatuh & bersihkan baris penuh.",
        mount,
        unmount,
        restart
      };
    })();

    // #03 SNAKE / COSMIC TRAIL (Pengatur Kecepatan Santai / Normal / Cepat)
    VirSagiArcade.Games.snake = (() => {
      const ID = "snake";
      const SIZE = 18;
      const CELL = 17;
      const SPEEDS = [
        { label: "Santai", ms: 230 },
        { label: "Normal", ms: 165 },
        { label: "Cepat", ms: 110 }
      ];

      let speedIdx = 0; // Default Santai agar nyaman di HP
      let canvas = null;
      let ctx = null;
      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let star = { x: 10, y: 10 };
      let score = 0;
      let loopTimer = null;
      let isOver = false;
      let speedBtns = [];

      function spawnStar() {
        let pos;
        do {
          pos = {
            x: Math.floor(Math.random() * SIZE),
            y: Math.floor(Math.random() * SIZE)
          };
        } while (snake.some((s) => s.x === pos.x && s.y === pos.y));
        star = pos;
      }

      function setDirection(nx, ny) {
        if (nx === -dir.x && ny === -dir.y) return;
        nextDir = { x: nx, y: ny };
      }

      function applySpeed(idx) {
        speedIdx = idx;
        speedBtns.forEach((b, i) => b.classList.toggle("active-pill", i === speedIdx));
        if (!isOver) {
          clearInterval(loopTimer);
          loopTimer = setInterval(tick, SPEEDS[speedIdx].ms);
        }
        updateStats();
      }

      function tick() {
        if (isOver) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
          finishGame();
          return;
        }
        if (snake.some((seg) => seg.x === head.x && seg.y === head.y)) {
          finishGame();
          return;
        }

        snake.unshift(head);
        if (head.x === star.x && head.y === star.y) {
          score += 10;
          VirSagiArcade.playTone(760, 0.07, "triangle");
          spawnStar();
          updateStats();
        } else {
          snake.pop();
        }
        draw();
      }

      function finishGame() {
        isOver = true;
        clearInterval(loopTimer);
        const best = VirSagiArcade.updateBestIfHigher(ID, score);
        VirSagiArcade.playTone(210, 0.22, "sawtooth");
        VirSagiArcade.showBanner(`Jejak terputus! Skor: ${score} • Rekor: ${best}`);
      }

      function updateStats() {
        const best = VirSagiArcade.readStorage(ID, "best", 0);
        VirSagiArcade.setStats(`${SPEEDS[speedIdx].label} • Skor: ${score} • Rekor: ${best}`);
      }

      function draw() {
        if (!ctx) return;
        ctx.fillStyle = "#080d1a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Bintang target bersinar
        ctx.fillStyle = "#f5b942";
        ctx.beginPath();
        ctx.arc(star.x * CELL + CELL / 2, star.y * CELL + CELL / 2, CELL * 0.4, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((seg, i) => {
          ctx.fillStyle = i === 0 ? "#4cc9f0" : "#72efdd";
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
          ctx.fill();
        });
      }

      function onKeyDown(e) {
        if (e.key === "ArrowUp") setDirection(0, -1);
        else if (e.key === "ArrowDown") setDirection(0, 1);
        else if (e.key === "ArrowLeft") setDirection(-1, 0);
        else if (e.key === "ArrowRight") setDirection(1, 0);
      }

      function restart() {
        clearInterval(loopTimer);
        snake = [{ x: 6, y: 9 }, { x: 5, y: 9 }, { x: 4, y: 9 }];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        isOver = false;
        spawnStar();
        applySpeed(speedIdx);
        draw();
      }

      function mount(container) {
        speedBtns = [];
        const speedBar = document.createElement("div");
        speedBar.className = "pill-row";
        SPEEDS.forEach((sp, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn";
          btn.textContent = sp.label;
          btn.addEventListener("click", () => {
            VirSagiArcade.playTone(600, 0.04, "sine");
            applySpeed(i);
          });
          speedBtns.push(btn);
          speedBar.appendChild(btn);
        });

        canvas = document.createElement("canvas");
        canvas.className = "game-canvas";
        canvas.width = SIZE * CELL;
        canvas.height = SIZE * CELL;
        ctx = canvas.getContext("2d");

        const pad = document.createElement("div");
        pad.className = "pad-grid";
        pad.innerHTML = `
          <span></span>
          <button type="button" class="pad-btn" data-d="up">▲</button>
          <span></span>
          <button type="button" class="pad-btn" data-d="left">◀</button>
          <button type="button" class="pad-btn" data-d="down">▼</button>
          <button type="button" class="pad-btn" data-d="right">▶</button>
        `;
        pad.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-d]");
          if (!btn) return;
          const d = btn.dataset.d;
          if (d === "up") setDirection(0, -1);
          else if (d === "down") setDirection(0, 1);
          else if (d === "left") setDirection(-1, 0);
          else if (d === "right") setDirection(1, 0);
        });

        const hint = document.createElement("p");
        hint.className = "hint-text";
        hint.textContent = "Pilih kecepatan (Santai / Normal / Cepat) kapan saja saat bermain.";

        container.appendChild(speedBar);
        container.appendChild(canvas);
        container.appendChild(pad);
        container.appendChild(hint);
        window.addEventListener("keydown", onKeyDown);
        restart();
      }

      function unmount() {
        clearInterval(loopTimer);
        loopTimer = null;
        window.removeEventListener("keydown", onKeyDown);
        canvas = null;
        ctx = null;
        speedBtns = [];
      }

      return {
        icon: "🌠",
        title: "Snake / Cosmic Trail",
        desc: "Arahkan jejak bintang dengan kecepatan yang bisa diatur.",
        mount,
        unmount,
        restart
      };
    })();

    // #04 FLAPPY BIRD (Karakter Burung Kosmik Bersayap + Pilar Rintangan)
    VirSagiArcade.Games.flappy = (() => {
      const ID = "flappy";
      const W = 320;
      const H = 400;
      let canvas = null;
      let ctx = null;
      let rafId = null;
      let lastTs = 0;
      let birdY = 190;
      let velY = 0;
      let flapAnim = 0;
      let pipes = [];
      let starsBg = [];
      let spawnDist = 0;
      let score = 0;
      let isOver = false;

      function initStars() {
        starsBg = Array.from({ length: 24 }, () => ({
          x: Math.random() * W,
          y: Math.random() * (H - 40),
          r: 0.8 + Math.random() * 1.4
        }));
      }

      function flap() {
        if (isOver) return;
        velY = -270;
        flapAnim = 1;
        VirSagiArcade.playTone(660, 0.05, "sine");
      }

      function updateStats() {
        const best = VirSagiArcade.readStorage(ID, "best", 0);
        VirSagiArcade.setStats(`Skor: ${score} • Rekor: ${best}`);
      }

      function endRun() {
        if (isOver) return;
        isOver = true;
        cancelAnimationFrame(rafId);
        const best = VirSagiArcade.updateBestIfHigher(ID, score);
        VirSagiArcade.playTone(200, 0.2, "sawtooth");
        VirSagiArcade.showBanner(`Menabrak rintangan! Skor: ${score} • Rekor: ${best}`);
      }

      function step(ts) {
        if (isOver) return;
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.033, (ts - lastTs) / 1000);
        lastTs = ts;

        velY += 840 * dt;
        birdY += velY * dt;
        flapAnim = Math.max(0, flapAnim - dt * 4.5);

        if (birdY < 14 || birdY > H - 24) {
          endRun();
          return;
        }

        const speed = 132;
        spawnDist += speed * dt;
        if (spawnDist >= 170) {
          spawnDist = 0;
          const gap = 114;
          const topH = 44 + Math.random() * (H - gap - 110);
          pipes.push({ x: W, topH, gap, passed: false });
        }

        const birdX = 72;
        const birdR = 12;

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= speed * dt;

          if (!p.passed && p.x + 40 < birdX) {
            p.passed = true;
            score++;
            VirSagiArcade.playTone(820, 0.06, "triangle");
            updateStats();
          }

          const hitX = birdX + birdR - 2 > p.x && birdX - birdR + 2 < p.x + 40;
          const hitTop = birdY - birdR + 2 < p.topH;
          const hitBot = birdY + birdR - 2 > p.topH + p.gap;
          if (hitX && (hitTop || hitBot)) {
            endRun();
            return;
          }

          if (p.x < -50) pipes.splice(i, 1);
        }

        draw();
        rafId = requestAnimationFrame(step);
      }

      function drawBird(x, y) {
        ctx.save();
        ctx.translate(x, y);
        const tilt = Math.max(-0.45, Math.min(0.65, velY / 420));
        ctx.rotate(tilt);

        // Ekor
        ctx.fillStyle = "#ff5d8f";
        ctx.beginPath();
        ctx.moveTo(-11, 0);
        ctx.lineTo(-19, -5);
        ctx.lineTo(-17, 4);
        ctx.closePath();
        ctx.fill();

        // Badan burung
        ctx.fillStyle = "#f5b942";
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // Perut terang
        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.ellipse(2, 3, 9, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Sayap mengepak
        const wingAngle = flapAnim > 0 ? -0.65 : 0.25;
        ctx.save();
        ctx.translate(-2, 0);
        ctx.rotate(wingAngle);
        ctx.fillStyle = "#4cc9f0";
        ctx.beginPath();
        ctx.ellipse(-2, 2, 8, 4.5, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Mata
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(6, -3, 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(7, -3, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Paruh
        ctx.fillStyle = "#fb7185";
        ctx.beginPath();
        ctx.moveTo(12, -1);
        ctx.lineTo(20, 2);
        ctx.lineTo(12, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function draw() {
        if (!ctx) return;
        ctx.fillStyle = "#091024";
        ctx.fillRect(0, 0, W, H);

        // Bintang latar
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        starsBg.forEach((s) => {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Pilar kosmik dengan topi bibir pipa
        pipes.forEach((p) => {
          ctx.fillStyle = "#1e3a5f";
          ctx.fillRect(p.x + 3, 0, 34, p.topH);
          ctx.fillRect(p.x + 3, p.topH + p.gap, 34, H - (p.topH + p.gap));

          ctx.fillStyle = "#4cc9f0";
          ctx.fillRect(p.x, p.topH - 10, 40, 10);
          ctx.fillRect(p.x, p.topH + p.gap, 40, 10);
        });

        // Tanah bawah
        ctx.fillStyle = "#16213e";
        ctx.fillRect(0, H - 14, W, 14);

        drawBird(72, birdY);
      }

      function onKeyDown(e) {
        if (e.code === "Space" || e.key === "ArrowUp") {
          e.preventDefault();
          flap();
        }
      }

      function restart() {
        cancelAnimationFrame(rafId);
        lastTs = 0;
        birdY = 190;
        velY = 0;
        flapAnim = 0;
        pipes = [];
        spawnDist = 115;
        score = 0;
        isOver = false;
        initStars();
        updateStats();
        draw();
        rafId = requestAnimationFrame(step);
      }

      function mount(container) {
        canvas = document.createElement("canvas");
        canvas.className = "game-canvas";
        canvas.width = W;
        canvas.height = H;
        ctx = canvas.getContext("2d");

        canvas.addEventListener("pointerdown", flap);
        window.addEventListener("keydown", onKeyDown);

        const hint = document.createElement("p");
        hint.className = "hint-text";
        hint.textContent = "Tap layar untuk mengepakkan sayap melewati pilar langit.";

        container.appendChild(canvas);
        container.appendChild(hint);
        restart();
      }

      function unmount() {
        cancelAnimationFrame(rafId);
        rafId = null;
        window.removeEventListener("keydown", onKeyDown);
        if (canvas) canvas.removeEventListener("pointerdown", flap);
        canvas = null;
        ctx = null;
      }

      return {
        icon: "🕊️",
        title: "Flappy Bird",
        desc: "Terbangkan burung kosmik melewati celah pilar.",
        mount,
        unmount,
        restart
      };
    })();

    // #05 SOLITAIRE (Tampilan Meja Kartu Bertumpuk Ala Solitaire PC + Auto-Foundation + Undo)
    VirSagiArcade.Games.solitaire = (() => {
      const ID = "solitaire";
      const SUITS = ["♠", "♥", "♦", "♣"];
      let stock = [];
      let waste = [];
      let foundations = [[], [], [], []];
      let tableau = [];
      let selected = null;
      let score = 0;
      let history = [];
      let rootEl = null;

      function isRed(suit) {
        return suit === "♥" || suit === "♦";
      }

      function cloneState() {
        return JSON.stringify({ stock, waste, foundations, tableau, score });
      }

      function pushHistory() {
        history.push(cloneState());
        if (history.length > 25) history.shift();
      }

      function undoMove() {
        if (history.length === 0) return;
        const prev = JSON.parse(history.pop());
        stock = prev.stock;
        waste = prev.waste;
        foundations = prev.foundations;
        tableau = prev.tableau;
        score = prev.score;
        selected = null;
        VirSagiArcade.playTone(430, 0.05, "sine");
        render();
      }

      function buildDeck() {
        const deck = [];
        for (let s = 0; s < 4; s++) {
          for (let r = 1; r <= 13; r++) {
            deck.push({ suit: SUITS[s], rank: r, faceUp: false });
          }
        }
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
      }

      function rankLabel(r) {
        if (r === 1) return "A";
        if (r === 11) return "J";
        if (r === 12) return "Q";
        if (r === 13) return "K";
        return String(r);
      }

      function canStackTableau(card, targetTop) {
        if (!targetTop) return card.rank === 13;
        return isRed(card.suit) !== isRed(targetTop.suit) && card.rank === targetTop.rank - 1;
      }

      function canStackFoundation(card, pile) {
        if (pile.length === 0) return card.rank === 1;
        const top = pile[pile.length - 1];
        return top.suit === card.suit && card.rank === top.rank + 1;
      }

      function revealTops() {
        tableau.forEach((col) => {
          if (col.length > 0 && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
            score += 5;
          }
        });
      }

      function checkWin() {
        const total = foundations.reduce((acc, p) => acc + p.length, 0);
        if (total === 52) {
          const finalScore = score + 250;
          const best = VirSagiArcade.updateBestIfHigher(ID, finalScore);
          VirSagiArcade.playTone(880, 0.2, "triangle");
          VirSagiArcade.showBanner(`Menang Solitaire! Skor: ${finalScore} • Rekor: ${best}`);
        }
      }

      function autoSendCardToFoundation(sourceInfo) {
        let card = null;
        if (sourceInfo.source === "waste" && waste.length > 0) {
          card = waste[waste.length - 1];
        } else if (sourceInfo.source === "tab") {
          const col = tableau[sourceInfo.col];
          if (col.length > 0 && sourceInfo.cardIdx === col.length - 1) {
            card = col[col.length - 1];
          }
        }
        if (!card) return false;

        const suitIdx = SUITS.indexOf(card.suit);
        if (suitIdx >= 0 && canStackFoundation(card, foundations[suitIdx])) {
          pushHistory();
          if (sourceInfo.source === "waste") {
            foundations[suitIdx].push(waste.pop());
          } else {
            foundations[suitIdx].push(tableau[sourceInfo.col].pop());
            revealTops();
          }
          score += 15;
          selected = null;
          VirSagiArcade.playTone(780, 0.07, "triangle");
          render();
          checkWin();
          return true;
        }
        return false;
      }

      function drawStock() {
        selected = null;
        if (stock.length === 0 && waste.length === 0) return;
        pushHistory();
        if (stock.length > 0) {
          const c = stock.pop();
          c.faceUp = true;
          waste.push(c);
          VirSagiArcade.playTone(500, 0.04, "sine");
        } else {
          stock = waste.reverse().map((c) => ({ ...c, faceUp: false }));
          waste = [];
          VirSagiArcade.playTone(440, 0.04, "sine");
        }
        render();
      }

      function tryMoveToFoundation(fIdx) {
        if (!selected) return;
        const pile = foundations[fIdx];
        if (selected.source === "waste" && waste.length > 0) {
          const card = waste[waste.length - 1];
          if (canStackFoundation(card, pile)) {
            pushHistory();
            pile.push(waste.pop());
            score += 15;
            selected = null;
            VirSagiArcade.playTone(780, 0.07, "triangle");
            render();
            checkWin();
          }
        } else if (selected.source === "tab") {
          const col = tableau[selected.col];
          if (col.length > 0 && selected.cardIdx === col.length - 1) {
            const card = col[col.length - 1];
            if (canStackFoundation(card, pile)) {
              pushHistory();
              pile.push(col.pop());
              score += 15;
              selected = null;
              revealTops();
              VirSagiArcade.playTone(780, 0.07, "triangle");
              render();
              checkWin();
            }
          }
        }
      }

      function tryMoveToTableau(targetColIdx) {
        if (!selected) return;
        const destCol = tableau[targetColIdx];
        const destTop = destCol.length > 0 ? destCol[destCol.length - 1] : null;

        if (selected.source === "waste" && waste.length > 0) {
          const card = waste[waste.length - 1];
          if (canStackTableau(card, destTop)) {
            pushHistory();
            destCol.push(waste.pop());
            score += 5;
            selected = null;
            VirSagiArcade.playTone(620, 0.05, "sine");
            render();
          }
        } else if (selected.source === "tab") {
          if (selected.col === targetColIdx) {
            selected = null;
            render();
            return;
          }
          const srcCol = tableau[selected.col];
          const movingStack = srcCol.slice(selected.cardIdx);
          if (movingStack.length > 0 && canStackTableau(movingStack[0], destTop)) {
            pushHistory();
            srcCol.splice(selected.cardIdx);
            destCol.push(...movingStack);
            score += 5;
            selected = null;
            revealTops();
            VirSagiArcade.playTone(620, 0.05, "sine");
            render();
          }
        }
      }

      function makeCardEl(card, isSel = false) {
        const el = document.createElement("button");
        el.type = "button";
        if (!card.faceUp) {
          el.className = "sol-card-face back";
          el.textContent = "✦";
          return el;
        }
        el.className = "sol-card-face" + (isRed(card.suit) ? " red" : "") + (isSel ? " selected" : "");
        const lbl = `${rankLabel(card.rank)}${card.suit}`;
        el.innerHTML = `<span class="sol-corner">${lbl}</span><span class="sol-center-suit">${card.suit}</span>`;
        return el;
      }

      function render() {
        const best = VirSagiArcade.readStorage(ID, "best", 0);
        VirSagiArcade.setStats(`Skor: ${score} • Rekor: ${best}`);
        rootEl.innerHTML = "";

        const actionBar = document.createElement("div");
        actionBar.className = "pill-row";

        const undoBtn = document.createElement("button");
        undoBtn.type = "button";
        undoBtn.className = "btn";
        undoBtn.textContent = `↩ Undo (${history.length})`;
        undoBtn.disabled = history.length === 0;
        undoBtn.addEventListener("click", undoMove);

        const autoBtn = document.createElement("button");
        autoBtn.type = "button";
        autoBtn.className = "btn";
        autoBtn.textContent = "⚡ Naikkan Kartu Otomatis";
        autoBtn.addEventListener("click", () => {
          let moved = false;
          if (autoSendCardToFoundation({ source: "waste" })) moved = true;
          for (let c = 0; c < 7 && !moved; c++) {
            if (tableau[c].length > 0) {
              moved = autoSendCardToFoundation({ source: "tab", col: c, cardIdx: tableau[c].length - 1 });
            }
          }
        });

        actionBar.appendChild(undoBtn);
        actionBar.appendChild(autoBtn);

        const table = document.createElement("div");
        table.className = "sol-table";

        // Baris atas: Stock, Waste, Spacer, 4 Foundation
        const topRow = document.createElement("div");
        topRow.className = "sol-top-row";

        if (stock.length > 0) {
          const stBtn = document.createElement("button");
          stBtn.type = "button";
          stBtn.className = "sol-card-face back";
          stBtn.textContent = String(stock.length);
          stBtn.addEventListener("click", drawStock);
          topRow.appendChild(stBtn);
        } else {
          const emptySt = document.createElement("button");
          emptySt.type = "button";
          emptySt.className = "sol-slot";
          emptySt.textContent = "↻";
          emptySt.addEventListener("click", drawStock);
          topRow.appendChild(emptySt);
        }

        const wasteTop = waste.length > 0 ? waste[waste.length - 1] : null;
        if (wasteTop) {
          const isSel = selected && selected.source === "waste";
          const wCard = makeCardEl(wasteTop, isSel);
          wCard.addEventListener("click", () => {
            if (isSel) {
              // Tap kedua kali pada kartu yang sama langsung kirim ke pondasi jika cocok
              if (!autoSendCardToFoundation({ source: "waste" })) {
                selected = null;
                render();
              }
            } else {
              selected = { source: "waste" };
              render();
            }
          });
          topRow.appendChild(wCard);
        } else {
          const emptyW = document.createElement("div");
          emptyW.className = "sol-slot";
          topRow.appendChild(emptyW);
        }

        const spacer = document.createElement("div");
        topRow.appendChild(spacer);

        foundations.forEach((pile, idx) => {
          const top = pile.length > 0 ? pile[pile.length - 1] : null;
          if (top) {
            const fCard = makeCardEl(top, false);
            fCard.addEventListener("click", () => {
              if (selected) tryMoveToFoundation(idx);
            });
            topRow.appendChild(fCard);
          } else {
            const fSlot = document.createElement("button");
            fSlot.type = "button";
            fSlot.className = "sol-slot";
            fSlot.textContent = SUITS[idx];
            fSlot.addEventListener("click", () => {
              if (selected) tryMoveToFoundation(idx);
            });
            topRow.appendChild(fSlot);
          }
        });

        // 7 Kolom Tableau Tumpang-Tindih Vertikal Ala PC
        const tabGrid = document.createElement("div");
        tabGrid.className = "sol-tableau-grid";

        tableau.forEach((col, colIdx) => {
          const colWrap = document.createElement("div");
          colWrap.className = "sol-stack-col";

          if (col.length === 0) {
            const kSlot = document.createElement("button");
            kSlot.type = "button";
            kSlot.className = "sol-slot";
            kSlot.style.width = "100%";
            kSlot.textContent = "K";
            kSlot.addEventListener("click", () => {
              if (selected) tryMoveToTableau(colIdx);
            });
            colWrap.appendChild(kSlot);
          } else {
            let offsetY = 0;
            col.forEach((card, cIdx) => {
              const isSel =
                selected &&
                selected.source === "tab" &&
                selected.col === colIdx &&
                cIdx >= selected.cardIdx;
              const cEl = makeCardEl(card, isSel);
              cEl.classList.add("sol-stack-item");
              cEl.style.top = `${offsetY}px`;
              cEl.style.zIndex = String(cIdx + 1);

              cEl.addEventListener("click", (ev) => {
                ev.stopPropagation();
                if (!card.faceUp) return;
                if (selected) {
                  if (selected.source === "tab" && selected.col === colIdx && selected.cardIdx === cIdx) {
                    if (!autoSendCardToFoundation({ source: "tab", col: colIdx, cardIdx: cIdx })) {
                      selected = null;
                      render();
                    }
                  } else {
                    tryMoveToTableau(colIdx);
                  }
                } else {
                  selected = { source: "tab", col: colIdx, cardIdx: cIdx };
                  render();
                }
              });

              colWrap.appendChild(cEl);
              offsetY += card.faceUp ? 22 : 10;
            });
            colWrap.style.height = `${offsetY + 62}px`;
          }

          tabGrid.appendChild(colWrap);
        });

        table.appendChild(topRow);
        table.appendChild(tabGrid);

        const hint = document.createElement("p");
        hint.className = "hint-text";
        hint.textContent = "Susun kartu merah-hitam selang-seling menurun (K→A). Tap 2× kartu terbuka untuk naik otomatis ke pondasi (♠♥♦♣).";

        rootEl.appendChild(actionBar);
        rootEl.appendChild(table);
        rootEl.appendChild(hint);
      }

      function restart() {
        const deck = buildDeck();
        foundations = [[], [], [], []];
        tableau = Array.from({ length: 7 }, () => []);
        waste = [];
        selected = null;
        score = 0;
        history = [];

        for (let c = 0; c < 7; c++) {
          for (let r = 0; r <= c; r++) {
            const card = deck.pop();
            card.faceUp = r === c;
            tableau[c].push(card);
          }
        }
        stock = deck;
        render();
      }

      function mount(container) {
        rootEl = document.createElement("div");
        rootEl.style.width = "100%";
        rootEl.style.display = "flex";
        rootEl.style.flexDirection = "column";
        rootEl.style.gap = "10px";
        container.appendChild(rootEl);
        restart();
      }

      function unmount() {
        rootEl = null;
      }

      return {
        icon: "🃏",
        title: "Solitaire",
        desc: "Klondike klasik 7 kolom dengan kartu bertumpuk & Undo.",
        mount,
        unmount,
        restart
      };
    })();

    // #06 MINESWEEPER (8x8, 10 Ranjau + Mode Bendera)
    VirSagiArcade.Games.minesweeper = (() => {
      const ID = "minesweeper";
      const SIZE = 8;
      const MINES = 10;
      let grid = [];
      let flagMode = false;
      let openedCount = 0;
      let gameDone = false;
      let boardEl = null;
      let flagBtn = null;

      function neighbors(r, c) {
        const list = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
              list.push([nr, nc]);
            }
          }
        }
        return list;
      }

      function initBoard() {
        grid = Array.from({ length: SIZE }, () =>
          Array.from({ length: SIZE }, () => ({
            mine: false,
            open: false,
            flag: false,
            adj: 0
          }))
        );
        openedCount = 0;
        gameDone = false;

        let placed = 0;
        while (placed < MINES) {
          const r = Math.floor(Math.random() * SIZE);
          const c = Math.floor(Math.random() * SIZE);
          if (!grid[r][c].mine) {
            grid[r][c].mine = true;
            placed++;
          }
        }

        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c].mine) continue;
            grid[r][c].adj = neighbors(r, c).filter(([nr, nc]) => grid[nr][nc].mine).length;
          }
        }
        render();
      }

      function revealCell(r, c) {
        if (gameDone) return;
        const cell = grid[r][c];
        if (cell.open || cell.flag) return;

        cell.open = true;
        if (cell.mine) {
          gameDone = true;
          grid.forEach((row) => row.forEach((x) => { if (x.mine) x.open = true; }));
          render();
          VirSagiArcade.playTone(190, 0.22, "sawtooth");
          VirSagiArcade.showBanner("Kena ranjau! Coba lagi yuk.");
          return;
        }

        openedCount++;
        VirSagiArcade.playTone(560, 0.04, "sine");

        if (cell.adj === 0) {
          neighbors(r, c).forEach(([nr, nc]) => {
            if (!grid[nr][nc].open) revealCell(nr, nc);
          });
        }

        const safeTotal = SIZE * SIZE - MINES;
        if (openedCount === safeTotal) {
          gameDone = true;
          const score = 100;
          const best = VirSagiArcade.updateBestIfHigher(ID, score);
          render();
          VirSagiArcade.playTone(840, 0.16, "triangle");
          VirSagiArcade.showBanner(`Area aman bersih! Skor: +${score} • Rekor: ${best}`);
        } else {
          render();
        }
      }

      function onCellClick(r, c) {
        if (gameDone) return;
        if (flagMode) {
          const cell = grid[r][c];
          if (!cell.open) {
            cell.flag = !cell.flag;
            VirSagiArcade.playTone(640, 0.04, "triangle");
            render();
          }
        } else {
          revealCell(r, c);
        }
      }

      function render() {
        const best = VirSagiArcade.readStorage(ID, "best", 0);
        const flags = grid.flat().filter((x) => x.flag).length;
        VirSagiArcade.setStats(`Bendera: ${flags}/${MINES} • Rekor: ${best}`);
        if (flagBtn) {
          flagBtn.textContent = flagMode ? "Mode: Pasang Bendera 🚩" : "Mode: Buka Kotak 🔍";
        }

        boardEl.innerHTML = "";
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "mine-cell" +
              (cell.open ? " revealed" : "") +
              (cell.flag && !cell.open ? " flagged" : "");

            if (cell.open) {
              if (cell.mine) btn.textContent = "💣";
              else if (cell.adj > 0) btn.textContent = String(cell.adj);
            } else if (cell.flag) {
              btn.textContent = "🚩";
            }

            btn.addEventListener("click", () => onCellClick(r, c));
            boardEl.appendChild(btn);
          }
        }
      }

      function mount(container) {
        const bar = document.createElement("div");
        bar.className = "row-controls";
        flagBtn = document.createElement("button");
        flagBtn.type = "button";
        flagBtn.className = "btn";
        flagBtn.addEventListener("click", () => {
          flagMode = !flagMode;
          render();
        });
        bar.appendChild(flagBtn);

        boardEl = document.createElement("div");
        boardEl.className = "mine-grid";

        const hint = document.createElement("p");
        hint.className = "hint-text";
        hint.textContent = "Angka menunjukkan jumlah ranjau di 8 kotak sekitar. Ganti mode untuk pasang bendera.";

        container.appendChild(bar);
        container.appendChild(boardEl);
        container.appendChild(hint);
        initBoard();
      }

      function unmount() {
        boardEl = null;
        flagBtn = null;
      }

      return {
        icon: "💣",
        title: "Minesweeper",
        desc: "Buka semua kotak aman menggunakan petunjuk angka.",
        mount,
        unmount,
        restart: initBoard
      };
    })();

    // #07 TANGRAM (7 Keping Bangun Datar Geometri Klasik: Segitiga, Persegi, Jajar Genjang)

      const ID = "tangram";

      const BASE_PIECES = [

      const PUZZLES = [

      let puzzleIdx = 0;

      let activeIdx = 0;

      function rotatePoint(px, py, deg) {
        const rad = (deg * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);
        return [px * cos - py * sin, px * sin + py * cos];
      }

      function getWorldPolygon(piece) {
        return piece.pts.map(([px, py]) => {
          const [rx, ry] = rotatePoint(px, py, piece.rot);
          return [piece.x + rx, piece.y + ry];
        });
      }

      function pointInPoly(x, y, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i][0], yi = poly[i][1];
          const xj = poly[j][0], yj = poly[j][1];
          const intersect = ((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-9) + xi);
          if (intersect) inside = !inside;
        }
        return inside;

      function setupPuzzle(idx = puzzleIdx) {
