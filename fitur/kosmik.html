<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosmik — Virgo Boy & Sagittarius Girl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10072a;--plum:#2d1558;--virgo:#9fd9b6;--sagi:#ffa24f;--dust:#f2eaff;--mute:#b3a6d1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--dust);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
main{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));pointer-events:none}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(1.5rem,5vw,2.4rem);letter-spacing:.02em;line-height:1}
h1 em{color:var(--mute)}
.sub{margin-top:4px;color:var(--mute);font-size:.78rem}
#hide{pointer-events:auto;padding:6px 10px;border-radius:999px;border:1px solid rgba(242,234,255,.25);background:rgba(45,21,88,.6);color:var(--dust);font:600 .7rem Figtree,sans-serif;cursor:pointer;white-space:nowrap}
.panel{pointer-events:auto;max-width:460px;max-height:44vh;overflow:auto;background:rgba(45,21,88,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(242,234,255,.16);border-radius:16px;padding:10px 12px}
.panel[hidden]{display:none}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tabs button{flex:1;padding:6px 2px;border-radius:999px;border:1px solid rgba(242,234,255,.25);background:transparent;color:var(--dust);font:600 .68rem Figtree,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{color:#10072a}
#t-v[aria-selected=true]{background:var(--virgo);border-color:var(--virgo)}
#t-s[aria-selected=true]{background:var(--sagi);border-color:var(--sagi)}
#t-b[aria-selected=true],#t-h[aria-selected=true]{background:var(--dust);border-color:var(--dust)}
h2{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:1.05rem;margin-bottom:2px}
#txt{line-height:1.4;font-size:.78rem}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.72rem;color:var(--mute)}
input[type=range]{flex:1;accent-color:var(--dust)}
.meter{margin-top:6px;font-size:.72rem;color:var(--mute)}
.meter div{height:6px;border-radius:3px;background:rgba(242,234,255,.12);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--virgo),var(--sagi));transition:width .3s}
.act{display:flex;gap:6px;margin-top:8px}
.act button,#wish button{flex:1;padding:7px 4px;border-radius:10px;border:1px solid rgba(242,234,255,.25);background:rgba(242,234,255,.08);color:var(--dust);font:600 .72rem Figtree,sans-serif;cursor:pointer}
#wish{margin-top:10px}
#wish input{width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(242,234,255,.25);background:rgba(16,7,42,.6);color:var(--dust);font:400 .8rem Figtree,sans-serif}
#wish .act{margin-top:8px}
#wroomrow{margin-bottom:10px}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--dust);outline-offset:2px}
.hint{font-size:.68rem;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<canvas id="sky" aria-label="Langit kosmik: dua bintang mengorbit"></canvas>
<main>
  <header>
    <div>
      <h1>Kosmik</h1>
      <p class="sub">Virgo boy <em>&amp;</em> Sagittarius girl</p>
    </div>
    <button id="hide">Sembunyikan panel</button>
  </header>
  <section class="panel" id="panel" aria-live="polite">
    <div class="tabs" role="tablist">
      <button id="t-v" role="tab" aria-selected="true">Virgo boy</button>
      <button id="t-s" role="tab" aria-selected="false">Sagittarius girl</button>
      <button id="t-b" role="tab" aria-selected="false">Bersama</button>
      <button id="t-h" role="tab" aria-selected="false">Harapan</button>
    </div>
    <h2 id="ttl"></h2>
    <p id="txt"></p>
    <div id="meters" hidden>
      <div class="meter">Kedekatan<div><i id="m1"></i></div></div>
      <div class="meter">Kebebasan<div><i id="m2"></i></div></div>
      <div class="meter">Keseimbangan<div><i id="m3"></i></div></div>
    </div>
    <div id="wish" hidden>
      <div id="wroomrow"><input id="wroom" maxlength="30" autocomplete="off" placeholder="Kode ruang rahasia (6+ huruf/angka)" aria-label="Kode ruang"><div class="act"><button id="wcon">Hubungkan</button></div></div>
      <input id="wtxt" maxlength="24" placeholder="Tulis satu harapan kalian" aria-label="Harapan">
      <div class="act"><button id="wadd">Kirim ke langit</button><button id="wclr">Hapus semua</button></div>
      <p class="hint" id="wst"></p>
    </div>
    <div class="row"><span>Dekat</span><input id="gap" type="range" min="40" max="200" value="110" aria-label="Jarak orbit"><span>Jauh</span></div>
    <div class="act">
      <button id="met">Hujan meteor</button>
      <button id="rev">Balik arah</button>
      <button id="snd" aria-pressed="false">Nada: mati</button>
    </div>
    <p class="hint">Sentuh langit: pindah pusat orbit dan lepas gelombang cahaya.</p>
  </section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('sky'),cx=cv.getContext('2d'),panel=$('panel'),head=document.querySelector('header');
var W,H,dpr=Math.min(window.devicePixelRatio||1,2);
var calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stars=[],meteors=[];
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=[];var n=Math.floor(W*H/5500);
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:Math.random()*1.5+.5});}
size();addEventListener('resize',size);

var ripples=[];
var c={x:W/2,y:H*.4},target={x:W/2,y:H*.4},moved=false;
var ang=0,dir=1,gap=110,gapNow=110,sky={top:0,h:H};
cv.addEventListener('pointerdown',function(e){target.x=e.clientX;target.y=e.clientY;moved=true;ripples.push({x:e.clientX,y:e.clientY,r:0});chime(2);});
cv.addEventListener('pointermove',function(e){if(e.buttons){target.x=e.clientX;target.y=e.clientY;moved=true;}});

var data={
 v:{t:'Virgo boy',c:'Bumi · Merkurius',x:'Teliti, tenang, dan diam-diam perhatian. Dia memperhatikan hal kecil yang orang lain lewatkan, lalu merapikannya tanpa banyak bicara. Bintangnya berputar dekat, rapi, dan setia pada jalurnya.'},
 s:{t:'Sagittarius girl',c:'Api · Jupiter',x:'Jujur, bebas, dan penuh rasa ingin tahu. Dia berlari ke arah horizon dan mengajak siapa pun ikut. Bintangnya berayun lebar, hangat, dan susah ditebak arahnya.'}
};
var tab='v';
function together(){
  if(gap<85)return 'Orbit rapat. Virgo membawa ketenangan, Sagittarius membawa gerak. Kalian saling menarik, tapi terlalu dekat bisa membuat kritik kecil terasa tajam dan kebebasan terasa sempit.';
  if(gap<150)return 'Orbit seimbang. Dia memberi struktur, dia memberi petualangan. Saat Virgo mau mendengar ide liar dan Sagittarius mau menepati rencana kecil, dua bintang ini saling menerangi.';
  return 'Orbit renggang. Ada ruang untuk bernapas dan bertualang sendiri-sendiri, tapi tarikannya melemah. Kirim kabar kecil secara rutin agar garis di antara kalian tidak putus.';
}
function meters(){
  var n=(gap-40)/160;
  $('m1').style.width=Math.round((1-n)*100)+'%';
  $('m2').style.width=Math.round(n*100)+'%';
  $('m3').style.width=Math.round(Math.max(0,1-Math.abs(gap-120)/80)*100)+'%';
}
function show(){
  var T=$('ttl'),X=$('txt');
  if(tab==='b'){T.textContent='Virgo & Sagittarius';X.textContent=together();meters();}
  else if(tab==='h'){T.textContent='Rasi kalian';X.textContent='Setiap harapan jadi satu bintang. Bintang-bintangnya tersambung menjadi rasi buatan kalian, dan hilang sendiri setelah 3 hari.';}
  else{T.textContent=data[tab].t;X.textContent=data[tab].c+' — '+data[tab].x;}
  $('meters').hidden=tab!=='b';$('wish').hidden=tab!=='h';
  ['v','s','b','h'].forEach(function(k){$('t-'+k).setAttribute('aria-selected',k===tab);});
}
['v','s','b','h'].forEach(function(k){$('t-'+k).onclick=function(){tab=k;show();};});
$('gap').oninput=function(){gap=+this.value;if(tab==='b')show();};
$('rev').onclick=function(){dir*=-1;};
$('met').onclick=function(){
  for(var i=0;i<9;i++)setTimeout(function(){
    meteors.push({x:Math.random()*W*1.2,y:-20,vx:-(4+Math.random()*4),vy:5+Math.random()*4,l:1});chime(Math.floor(Math.random()*8));
  },i*160);
};
$('hide').onclick=function(){
  panel.hidden=!panel.hidden;
  this.textContent=panel.hidden?'Tampilkan panel':'Sembunyikan panel';
};

var DB_URL='';  // tempel alamat Firebase di sini, contoh: https://nama-project-default-rtdb.firebaseio.com
var TTL=3*24*3600*1000,room='',seen={},firstSync=true,wishes=[];
try{room=localStorage.getItem('kosmik-room')||'';}catch(e){}
function live(){wishes=wishes.filter(function(w){return !w.ts||Date.now()-w.ts<TTL;});}
if(!DB_URL){try{wishes=JSON.parse(localStorage.getItem('kosmik-wishes')||'[]');}catch(e){}live();}
function saveW(){if(DB_URL)return;try{localStorage.setItem('kosmik-wishes',JSON.stringify(wishes));}catch(e){}}
function status(m){$('wst').textContent=m;}
function api(path,method,body){
  return fetch(DB_URL+'/rooms/'+room+path+'.json',{method:method||'GET',body:body?JSON.stringify(body):undefined})
    .then(function(r){if(!r.ok)throw 0;return r.json();});
}
function sync(){
  if(!DB_URL||!room)return;
  api('').then(function(d){
    var now=Date.now(),list=[];
    Object.keys(d||{}).forEach(function(id){
      var w=d[id];
      if(!w||typeof w.ts!=='number'||now-w.ts>=TTL){api('/'+id,'DELETE').catch(function(){});return;}
      list.push({id:id,t:String(w.t).slice(0,24),u:+w.u||.5,v:+w.v||.5,ts:w.ts,b:(firstSync||seen[id])?0:performance.now()});
      seen[id]=1;
    });
    firstSync=false;
    list.sort(function(a,b){return a.ts-b.ts;});
    wishes=list.slice(-12);
    status('Terhubung. Harapan hilang sendiri setelah 3 hari.');
  }).catch(function(){status('Gagal terhubung. Cek alamat database dan koneksi internet.');});
}
function addW(){
  var v=$('wtxt').value.trim();if(!v)return;
  var w={t:v.slice(0,24),u:.08+Math.random()*.84,v:.08+Math.random()*.84,ts:Date.now()};
  if(DB_URL){
    if(!room){status('Isi kode ruang dulu, lalu tekan Hubungkan.');return;}
    api('','POST',w).then(function(){$('wtxt').value='';sync();}).catch(function(){status('Gagal mengirim. Coba lagi.');});
    return;
  }
  w.b=performance.now();wishes.push(w);live();
  if(wishes.length>12)wishes.shift();
  saveW();$('wtxt').value='';
}
$('wadd').onclick=addW;
$('wtxt').onkeydown=function(e){if(e.key==='Enter')addW();};
$('wclr').onclick=function(){
  if(DB_URL){if(room)api('','DELETE').then(function(){wishes=[];seen={};status('Semua harapan dihapus.');}).catch(function(){status('Gagal menghapus.');});}
  else{wishes=[];saveW();}
};
$('wroomrow').hidden=!DB_URL;
$('wroom').value=room;
$('wcon').onclick=function(){
  var c=$('wroom').value.replace(/[^a-zA-Z0-9_-]/g,'');
  if(c.length<6){status('Kode ruang minimal 6 huruf atau angka.');return;}
  room=c;$('wroom').value=c;seen={};firstSync=true;wishes=[];
  try{localStorage.setItem('kosmik-room',room);}catch(e){}
  status('Menghubungkan...');sync();
};
setInterval(sync,8000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync();});
if(DB_URL&&room)sync();
show();


// Nada semesta: Virgo = nada rendah dan tenang, Sagittarius = nada tinggi dan ceria
var AC=null,soundOn=false,PENTA=[0,2,4,7,9,12,14,16];
function note(f,vol,len){
  if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n);
  g.gain.linearRampToValueAtTime(vol,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+len);
  o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+len+.05);
}
function chime(i){if(soundOn)note(523.25*Math.pow(2,PENTA[(i*3)%8]/12),.07,1.4);}
$('snd').onclick=function(){
  soundOn=!soundOn;
  if(soundOn&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){soundOn=false;}}
  if(AC&&AC.state==='suspended')AC.resume();
  this.textContent='Nada: '+(soundOn?'nyala':'mati');this.setAttribute('aria-pressed',soundOn);
};
var lvs=0,lss=0;
function glow(x,y,r,col){
  var g=cx.createRadialGradient(x,y,0,x,y,r*4);
  g.addColorStop(0,col);g.addColorStop(.25,col.replace(')',',.35)').replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*4,0,6.28);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,r*.45,0,6.28);cx.fill();
}
function clamp(v,a,b){return b<a?(a+b)/2:Math.min(b,Math.max(a,v));}
var last=0,trailV=[],trailS=[];
function frame(t){
  var dt=Math.min((t-last)/16.7||1,3);last=t;
  var k=calm?.3:1;

  // Area langit yang kosong: di antara judul dan panel
  var top=head.getBoundingClientRect().bottom+8;
  var bot=panel.hidden?H-24:panel.getBoundingClientRect().top-8;
  sky.top=top;sky.h=Math.max(bot-top,80);
  var sc=Math.min(1,(W/2-26)/(200*1.25),Math.max(sky.h/2-24,30)/(200*.8));
  var g=gapNow*sc;
  if(!moved){target.x=W/2;target.y=top+sky.h/2;}
  target.x=clamp(target.x,g*1.25+14,W-g*1.25-14);
  target.y=clamp(target.y,top+g*.8+14,top+sky.h-g*.8-14);

  c.x+=(target.x-c.x)*.05*dt;c.y+=(target.y-c.y)*.05*dt;
  gapNow+=(gap-gapNow)*.06*dt;
  ang+=dir*.012*k*dt;

  var bg=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,Math.max(W,H));
  bg.addColorStop(0,'#2d1558');bg.addColorStop(.5,'#1a0b3d');bg.addColorStop(1,'#10072a');
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);

  for(var i=0;i<stars.length;i++){
    var s=stars[i],a=.45+.45*Math.sin(s.p+t/1000*s.s*k);
    cx.fillStyle='rgba(242,234,255,'+a.toFixed(2)+')';
    cx.fillRect(s.x,s.y,s.r,s.r);
  }

  // Rasi harapan
  var wp=wishes.map(function(w){return [24+w.u*(W-48),sky.top+w.v*sky.h];});
  if(wp.length>1){
    cx.strokeStyle='rgba(242,234,255,.22)';cx.lineWidth=1;cx.beginPath();
    wp.forEach(function(p,j){j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);});cx.stroke();
  }
  cx.font='400 11px Figtree,sans-serif';cx.textAlign='center';
  wishes.forEach(function(w,j){
    var p=wp[j],tw=.7+.3*Math.sin(t/500+j*2),age=w.b?Math.min(1,(t-w.b)/700):1;
    glow(p[0],p[1],3+3*age,'rgb(242,234,255)');
    cx.fillStyle='rgba(242,234,255,'+(.8*tw*age).toFixed(2)+')';
    cx.fillText(w.t,p[0],p[1]+18);
  });

  // Virgo: orbit hampir bulat. Sagittarius: elips lebar, lebih cepat.
  var qv=Math.floor(ang/.7854),qs=Math.floor(-ang*1.6/.7854);
  if(qv!==lvs){lvs=qv;if(soundOn)note(130.81*Math.pow(2,PENTA[((qv%8)+8)%8]/12),.09,2.2);}
  if(qs!==lss){lss=qs;if(soundOn)note(392*Math.pow(2,PENTA[((qs%8)+8)%8]/12),.05,1.2);}
  var vx=c.x+Math.cos(ang)*g*.8,vy=c.y+Math.sin(ang)*g*.8;
  var sx=c.x+Math.cos(-ang*1.6+3.14)*g*1.25,sy=c.y+Math.sin(-ang*1.6+3.14)*g*.7;
  trailV.push([vx,vy]);trailS.push([sx,sy]);
  if(trailV.length>70){trailV.shift();trailS.shift();}
  function trail(tr,col){
    for(var j=1;j<tr.length;j++){
      cx.strokeStyle='rgba('+col+','+(j/tr.length*.5).toFixed(2)+')';cx.lineWidth=1.5;
      cx.beginPath();cx.moveTo(tr[j-1][0],tr[j-1][1]);cx.lineTo(tr[j][0],tr[j][1]);cx.stroke();
    }
  }
  trail(trailV,'159,217,182');trail(trailS,'255,162,79');

  var d=Math.hypot(vx-sx,vy-sy),la=Math.max(0,1-d/(g*2.4+1));
  cx.strokeStyle='rgba(242,234,255,'+(la*.7).toFixed(2)+')';cx.lineWidth=1;
  cx.setLineDash([4,6]);cx.beginPath();cx.moveTo(vx,vy);cx.lineTo(sx,sy);cx.stroke();cx.setLineDash([]);

  cx.fillStyle='rgba(242,234,255,.8)';cx.beginPath();cx.arc(c.x,c.y,2,0,6.28);cx.fill();
  glow(vx,vy,tab==='v'?13:9,'rgb(159,217,182)');
  glow(sx,sy,tab==='s'?13:9,'rgb(255,162,79)');

  cx.font='600 12px Figtree,sans-serif';cx.textAlign='center';
  cx.fillStyle='#9fd9b6';cx.fillText('♍',vx,vy-24);
  cx.fillStyle='#ffa24f';cx.fillText('♐',sx,sy-24);

  for(var rp=ripples.length-1;rp>=0;rp--){
    var ri=ripples[rp];ri.r+=3*dt;var ra=1-ri.r/220;
    if(ra<=0){ripples.splice(rp,1);continue;}
    cx.strokeStyle='rgba(242,234,255,'+(ra*.5).toFixed(2)+')';cx.lineWidth=1.5;
    cx.beginPath();cx.arc(ri.x,ri.y,ri.r,0,6.28);cx.stroke();
  }
  for(var m=meteors.length-1;m>=0;m--){
    var q=meteors[m];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=.006*dt;
    cx.strokeStyle='rgba(255,255,255,'+Math.max(q.l,0).toFixed(2)+')';cx.lineWidth=2;
    cx.beginPath();cx.moveTo(q.x,q.y);cx.lineTo(q.x-q.vx*7,q.y-q.vy*7);cx.stroke();
    if(q.l<=0||q.y>H+40)meteors.splice(m,1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
